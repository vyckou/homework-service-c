name: Install Lint And Build

on:
  push:
    branches: main
    paths-ignore:
      - 'README.md'
      - 'changelog.md'
    tags:
      - '*'
  pull_request:
    branches: main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: "${{ vars.PRIVATE_ECR_REGISTRY }}/homework-service-c:${{ github.sha}}"
          load: true

      - name: Verify image
        run: docker image inspect "${{ vars.PRIVATE_ECR_REGISTRY }}/homework-service-c:${{ github.sha}}"

      - name: Push image to ECR and release to Staging
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          github.ref == 'refs/heads/main'
        uses: vyckou/github-actions/image-push-and-deploy@main
        with:
          github-app-id: ${{ secrets.ARGOCD_GITOPS_APP_ID }}
          github-private-key: ${{ secrets.ARGOCD_GITOPS_APP_PEM }}
          service-name: "homework-service-c"
          image-name: "${{ vars.PRIVATE_ECR_REGISTRY }}/homework-service-c"
          image-tag: "${{ github.sha }}"
          environment: "staging"

      - name: Push image to ECR and release to Productiom
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'tag'
        uses: vyckou/github-actions/image-push-and-deploy@main
        with:
          github-app-id: ${{ secrets.ARGOCD_GITOPS_APP_ID }}
          github-private-key: ${{ secrets.ARGOCD_GITOPS_APP_PEM }}
          service-name: "homework-service-c"
          image-name: "${{ vars.PRIVATE_ECR_REGISTRY }}/homework-service-c"
          image-tag: "${{ github.ref_name }}"
          environment: "prod"